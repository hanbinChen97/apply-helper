[project]
name = "ai-resume-generator"
version = "0.1.0"
description = "AI-powered Resume & Cover Letter Generator"
authors = [{ name = "Jules", email = "jules@example.com" }]
requires-python = ">=3.9"
dependencies = [
    "streamlit",
    "litellm",
    "pydantic",
    "pyyaml",
    "weasyprint",
    "python-dotenv",
    "pytest",
    "tenacity",
    "markdown-it-py"
]

[tool.uv.scripts]
start = "streamlit run app/ui.py"
test = "pytest -q"
